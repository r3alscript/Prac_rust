version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: auction-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auction_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  bid-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: bid-api
    container_name: bid-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: sh -c "sleep 5 && bid-api"

  bid-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: bid-worker
    container_name: bid-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "sleep 5 && bid-worker"

  frontend:
    image: node:20
    container_name: auction-frontend
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./auction-ui:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    depends_on:
      - bid-api

volumes:
  postgres_data:
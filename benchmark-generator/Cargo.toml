[package]
name = "benchmark-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }

tokio = { version = "1", features = ["full"] }
lapin = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
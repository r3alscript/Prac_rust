[package]
name = "benchmark-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }

tokio = { version = "1", features = ["full"] }
lapin = "2"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
serde = { version = "1", features = ["derive"] }
[package]
name = "benchmark-api"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }

axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1.4.0"
time = "0.3.47"
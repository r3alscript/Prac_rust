[package]
name = "shared"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dotenvy = "0.15"
lapin = "2"
prost = "0.13"
bytes = "1.6"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"